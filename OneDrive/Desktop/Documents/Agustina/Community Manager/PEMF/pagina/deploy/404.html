<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Página no encontrada — PEMF Buenos Aires</title>
<link rel="icon" type="image/png" href="img/logo.png"/>
<link rel="canonical" href="https://pemfba.com/404.html"/>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@700;800;900&family=Noto+Sans:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --spring:cubic-bezier(.34,1.56,.64,1);
  --ease:cubic-bezier(.4,0,.2,1);
  --out:cubic-bezier(.22,1,.36,1);
}
body{font-family:'Noto Sans',sans-serif;background:linear-gradient(135deg,#faf8f4 0%,#f0f5fc 100%);color:#1a2332;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;overflow:hidden;position:relative;}

/* Fondo animado */
.bg-glow{position:fixed;border-radius:50%;pointer-events:none;opacity:.15;filter:blur(80px);}
.glow1{width:400px;height:400px;background:#1a4fb6;top:-100px;right:-100px;animation:float1 20s ease-in-out infinite;}
.glow2{width:300px;height:300px;background:#67CCE9;bottom:-50px;left:-100px;animation:float2 25s ease-in-out infinite;}
@keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(50px,-50px)}}
@keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(-30px,40px)}}

.wrap{text-align:center;max-width:480px;position:relative;z-index:1;animation:wrapSlide .8s var(--out);}
@keyframes wrapSlide{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}

.code{
  font-family:'Figtree',sans-serif;font-size:120px;font-weight:900;line-height:1;
  color:#e2e8f0;letter-spacing:-6px;margin-bottom:8px;
  cursor:pointer;user-select:none;
  transition:all .35s var(--spring);will-change:transform,color;
  animation:codeSlide .6s var(--spring);
  position:relative;
}
.code:hover{transform:scale(1.1) rotate(5deg);color:#1a4fb6;text-shadow:0 0 20px rgba(26,79,182,.5)}
.code:active{transform:scale(0.95)}
@keyframes codeSlide{from{opacity:0;transform:scale(0.5) rotate(-180deg)}to{opacity:1;transform:scale(1) rotate(0)}}

h1{font-family:'Figtree',sans-serif;font-size:28px;font-weight:900;color:#1a2332;margin-bottom:12px;animation:titleFlip .8s var(--spring) .15s backwards;}
@keyframes titleFlip{from{opacity:0;transform:rotateX(90deg)}to{opacity:1;transform:rotateX(0)}}

p{font-size:15px;color:#64748b;line-height:1.65;margin-bottom:32px;animation:fadeIn .8s var(--ease) .3s backwards;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.btn-home,.btn-wa{display:inline-flex;align-items:center;gap:8px;font-family:'Figtree',sans-serif;font-weight:700;font-size:14px;padding:13px 28px;border-radius:100px;text-decoration:none;border:none;cursor:pointer;transition:all .28s var(--spring);will-change:transform,box-shadow;}
.btn-home{background:#1a4fb6;color:#fff}
.btn-wa{background:#25D366;color:#fff;margin-left:10px;}
.btn-home:hover,.btn-wa:hover{transform:translateY(-4px) scale(1.06);box-shadow:0 12px 32px rgba(0,0,0,.2)}
.btn-home:active,.btn-wa:active{transform:scale(0.96)}

.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;animation:buttonsSlide .9s var(--spring) .45s backwards;}
@keyframes buttonsSlide{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}

.easter-egg{position:fixed;font-size:32px;pointer-events:none;animation:easterFly 2s ease-out forwards;}
@keyframes easterFly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(0)}}

.easter-message{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a4fb6;color:#fff;padding:12px 20px;border-radius:100px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;animation:messageSlide .4s var(--spring) forwards;z-index:999;}
@keyframes messageSlide{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
</style>
</head>
<div class="bg-glow glow1"></div>
<div class="bg-glow glow2"></div>

<div class="wrap">
  <div class="code" id="error-code">404</div>
  <h1 id="error-title">Página no encontrada</h1>
  <p id="error-message">El link que seguiste no existe o fue movido. Podés volver al inicio o escribirnos directamente por WhatsApp.</p>
  <div class="btns">
    <a class="btn-home" href="/">← Ir al inicio</a>
    <a class="btn-wa" href="https://wa.me/5491161054411" target="_blank" rel="noopener noreferrer">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      WhatsApp
    </a>
  </div>
</div>

<script>
const errorCode = document.getElementById('error-code');
const errorMessage = document.getElementById('error-message');
const errorTitle = document.getElementById('error-title');
let codeClicks = 0;

// Easter egg 1: Click en el código para transformaciones
const codeTransforms = ['404', '😵', '🎮', '💰', '🚀', '👽', '🔥', '∞', 'E(RR)', '?!?'];
errorCode.addEventListener('click', () => {
  codeClicks++;
  errorCode.textContent = codeTransforms[codeClicks % codeTransforms.length];

  // Crear efecto de partículas
  createParticles();
});

function createParticles() {
  const emojis = ['✨', '⭐', '🌟', '💫', '🎯'];
  for (let i = 0; i < 5; i++) {
    const particle = document.createElement('div');
    particle.className = 'easter-egg';
    particle.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    particle.style.left = Math.random() * window.innerWidth + 'px';
    particle.style.top = window.innerHeight / 2 + 'px';
    particle.style.setProperty('--tx', (Math.random() - 0.5) * 200 + 'px');
    particle.style.setProperty('--ty', -200 + Math.random() * 100 + 'px');
    particle.style.animationDelay = i * 0.1 + 's';
    document.body.appendChild(particle);

    setTimeout(() => particle.remove(), 2500);
  }
}

// Easter egg 2: Konami code para zona secreta
const konamiCode = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
let konamiIndex = 0;

document.addEventListener('keydown', (e) => {
  const key = e.key.toLowerCase() === 'b' || e.key.toLowerCase() === 'a' ? e.key.toLowerCase() : e.code;

  if (key === konamiCode[konamiIndex]) {
    konamiIndex++;
    if (konamiIndex === konamiCode.length) {
      activateSecretZone();
      konamiIndex = 0;
    }
  } else {
    konamiIndex = 0;
  }
});

function activateSecretZone() {
  errorTitle.textContent = '¡Zona Secreta Desbloqueada! 🔓';
  errorMessage.textContent = 'Felicidades, encontraste el código Konami. Eres oficialmente un detective de PEMF. Tu energía vital aumentó +100 puntos. ⚡✨';

  // Crear lluvia de emojis
  for (let i = 0; i < 30; i++) {
    const emoji = document.createElement('div');
    emoji.className = 'easter-egg';
    emoji.textContent = ['🎉', '✨', '⭐', '🌟', '💚', '🚀'][Math.floor(Math.random() * 6)];
    emoji.style.left = Math.random() * window.innerWidth + 'px';
    emoji.style.top = -50 + 'px';
    emoji.style.setProperty('--tx', (Math.random() - 0.5) * 100 + 'px');
    emoji.style.setProperty('--ty', window.innerHeight + 100 + 'px');
    emoji.style.animationDuration = (2 + Math.random()) + 's';
    emoji.style.animationDelay = i * 0.08 + 's';
    document.body.appendChild(emoji);

    setTimeout(() => emoji.remove(), 3500);
  }
}

// Easter egg 3: Doble click en el título para chiste
let titleClicks = 0;
let titleClickTimer;
errorTitle.addEventListener('click', () => {
  titleClicks++;
  clearTimeout(titleClickTimer);

  if (titleClicks === 2) {
    tellJoke();
    titleClicks = 0;
  }

  titleClickTimer = setTimeout(() => {
    titleClicks = 0;
  }, 500);
});

function tellJoke() {
  const jokes = [
    '¿Por qué 404 se siente solo? Porque no puede encontrar su camino a casa 😄',
    '404: Como un teléfono sin conexión... ¡pero peor! 📵',
    'Error 404: Tu paciencia no encontrada. Intenta más tarde. ⏳',
    'Si buscas la razón por la que estás aquí... también está perdida 🗺️'
  ];

  const joke = jokes[Math.floor(Math.random() * jokes.length)];

  const message = document.createElement('div');
  message.className = 'easter-message';
  message.textContent = joke;
  document.body.appendChild(message);

  setTimeout(() => message.remove(), 3500);
}

// Easter egg 4: Secreto al escribir "help"
let secretKeys = '';
document.addEventListener('keypress', (e) => {
  secretKeys += e.key.toLowerCase();
  if (secretKeys.includes('help')) {
    showHelp();
    secretKeys = '';
  }
  if (secretKeys.length > 20) {
    secretKeys = secretKeys.slice(-20);
  }
});

function showHelp() {
  const message = document.createElement('div');
  message.className = 'easter-message';
  message.textContent = 'Tips: Haz clic en el 404, presiona las flechas + B + A, doble-clic en el título. ¡Descubre todo! 🕵️';
  document.body.appendChild(message);

  setTimeout(() => message.remove(), 4500);
}
</script>
</body>
</html>
